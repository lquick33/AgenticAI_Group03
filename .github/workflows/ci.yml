name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SITE_URL: https://example.vercel.app
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -- --quiet

      - name: Type-check frontend
        run: npm exec tsc -- --noEmit

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: dummy
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: dummy
      DEBUG: false
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backend smoke test
        run: python backend/scripts/smoke_test.py

      - name: Standalone backend tests
        run: python backend/test_standalone.py
