# Headless Anki Container Configuration
# Uses ankimcp/headless-anki with AnkiConnect addon pre-installed
# Works on both ARM64 (Apple Silicon) and x86_64 (Intel/AMD)
# See: start_anki.sh for startup script

services:
  anki:
    build:
      context: https://github.com/ankimcp/headless-anki.git#main:x11-vnc-addons
      args:
        ADDON_IDS: "2055492159"  # AnkiConnect addon
    container_name: anki-agent
    ports:
      - "8765:8765"   # AnkiConnect API
      - "5900:5900"   # VNC for first-time AnkiWeb login setup
    volumes:
      # Use named volume so Docker initializes from container's /data
      - anki-data:/data
    restart: unless-stopped

volumes:
  anki-data:
